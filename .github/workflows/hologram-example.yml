name: Hologram integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hologram-example.yml'
      - 'packages/css/**'
      - 'packages/elements/**'
      - 'packages/react/**'
      - 'phoenix/**'
      - 'bun.lock'
      - 'package.json'
      - 'VERSION'
      - 'scripts/js/**'
  pull_request:
    paths:
      - '.github/workflows/hologram-example.yml'
      - 'packages/css/**'
      - 'packages/elements/**'
      - 'packages/react/**'
      - 'phoenix/**'
      - 'bun.lock'
      - 'package.json'
      - 'VERSION'
      - 'scripts/js/**'

permissions:
  contents: read

concurrency:
  group: hologram-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  example:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      MIX_ENV: test
      HOLOGRAM_START: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Install and build the locked Web packages
        run: |
          bun install --frozen-lockfile
          bun run build:packages
      - name: Build Hologram and shared styles with published binaries
        working-directory: phoenix
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          scripts/with-precompiled-toolchain.sh mix compile --warnings-as-errors
          scripts/with-precompiled-toolchain.sh mix duskmoon_bundler.build duskmoon_storybook
      - name: Verify Hologram examples
        working-directory: phoenix
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: scripts/with-precompiled-toolchain.sh mix test apps/duskmoon_storybook/hologram_test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hologram-integration-screenshots
          path: phoenix/_build/test/hologram-screenshots/*.png
          if-no-files-found: warn
