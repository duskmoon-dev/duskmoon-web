name: Deploy Duskmoon Web Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - apps/**
      - packages/**
      - yew/**
      - package.json
      - bun.lock
      - bunfig.toml
      - .gitattributes
      - VERSION
      - scripts/js/**
      - scripts/pages/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install Pages build dependencies
        run: |
          bun install --frozen-lockfile
          cargo install --locked trunk --version 0.21.14
      - name: Build and assemble the sites
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun scripts/pages/build.mjs "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
