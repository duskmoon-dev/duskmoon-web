name: Deploy Duskmoon Web Pages

on:
  workflow_run:
    workflows: [Web release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select the latest published Web release
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          finalized=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/attempts/$RELEASE_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "Publish GitHub release" and .conclusion == "success") | .id')
          if [[ -z "$finalized" ]]; then
            echo "The upstream run only staged artifacts."
            exit 0
          fi
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and any(.assets[]; .name == "release.json")) | .tag_name' |
            jq -Rsr '
              split("\n")
              | map(capture("^v(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)(?:-rc\\.(?<rc>0|[1-9][0-9]*))?$") + { tag: . })
              | sort_by([(.major | tonumber), (.minor | tonumber), (.patch | tonumber), (.rc == null), (.rc // "0" | tonumber)])
              | last.tag // error("No published Web release")
            ')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release.json --dir "$RUNNER_TEMP"
          source=$(jq -er --arg version "${tag#v}" 'select(.version == $version) | .sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/release.json")
          printf 'tag=%s\nsha=%s\n' "$tag" "$source" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Verify the published source
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.release.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(cat VERSION)" = "${RELEASE_TAG#v}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/configure-pages@v6
        id: pages
      - name: Install Pages build dependencies
        run: |
          bun install --frozen-lockfile
          cargo install --locked trunk --version 0.21.14
      - name: Build and assemble the sites
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun scripts/pages/build.mjs "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
