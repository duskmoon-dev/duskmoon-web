name: Web CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-26.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
      phoenix: ${{ steps.plan.outputs.phoenix }}
      yew: ${{ steps.plan.outputs.yew }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git hash-object -w -t tree /dev/null)
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          bun scripts/js/workspace.mjs plan "$base" | jq -r '"phoenix=\(.phoenix)", "yew=\(.yew)"' >> "$GITHUB_OUTPUT"
  js:
    needs: impact
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-1.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'bunfig.toml', 'scripts/js/**') }}
      - env:
          BASE: ${{ needs.impact.outputs.base }}
        run: |
          bun install --frozen-lockfile
          node scripts/release.mjs check
          bun scripts/js/workspace.mjs check "$BASE"
  phoenix:
    needs: impact
    if: needs.impact.outputs.phoenix == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      HOLOGRAM_START: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: actions/cache@v6
        with:
          path: phoenix/deps
          key: mix-precompiled-1.18-28-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('phoenix/mix.lock', 'phoenix/**/mix.exs', 'phoenix/scripts/native-policy.exs') }}
      - run: |
          bun install --frozen-lockfile
          bun run build:packages
      - name: Verify published toolchain and run Phoenix tests
        working-directory: phoenix
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIX_ENV: test
          DUSKMOON_NATIVE_INVOCATION_LOG: ${{ runner.temp }}/web-native-invocations.log
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          elixir scripts/native-policy-test.exs
          scripts/with-precompiled-toolchain.sh mix compile --warnings-as-errors
          scripts/with-precompiled-toolchain.sh mix storybook.assets
          scripts/with-precompiled-toolchain.sh mix test
          bun test --cwd apps/duskmoon_phoenix
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phoenix-native-invocations
          path: ${{ runner.temp }}/web-native-invocations.log
          if-no-files-found: ignore
  yew:
    needs: impact
    if: needs.impact.outputs.yew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Rust libraries and Worker resources
        working-directory: yew
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo build --locked --workspace --all-features
          cargo test --locked --workspace --all-features
          cargo check --locked --workspace --all-features --target wasm32-unknown-unknown
          node --test packages/code-engine/tests/*.test.mjs
      - name: Build Core CSS for the Trunk demo
        run: |
          bun install --frozen-lockfile
          bun scripts/js/workspace.mjs build @duskmoon-dev/core
          cargo install --locked trunk --version 0.21.14
      - name: Build the Trunk demo under a deployment subpath
        working-directory: yew/example
        run: trunk build --release --locked --public-url /yew/
